<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- card body -->
  <rect x="3" y="3" width="58" height="58" rx="12" fill="url(#bg)"/>
  <rect x="6" y="6" width="52" height="52" rx="9" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.85"/>

  <!-- top-left heart -->
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="17" fill="#ef4444" text-anchor="middle" font-weight="bold">♥</text>

  <!-- center rank -->
  <text x="32" y="45" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#f59e0b" text-anchor="middle">2</text>

  <!-- bottom-right spade -->
  <text x="48" y="51" font-family="Arial, sans-serif" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="bold">♠</text>
</svg>
